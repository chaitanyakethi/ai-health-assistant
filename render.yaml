# Render Blueprint for AI Health Assistance (Streamlit)
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo -> Apply
# Commands are root-proof: they work with Root Directory left EMPTY.
services:
  - type: web
    name: ai-health-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r prototype/requirements.txt
    startCommand: cd prototype && streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
